[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gsc-opportunity-mcp"
version = "0.2.0"
description = "MCP server that ranks Google Search Console opportunities by estimated revenue, not clicks."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
  # fastmcp 3.x requires the `server` extra; the slim distribution alone cannot
  # import FastMCP. mcp 2.x is NOT compatible with fastmcp 3.x — pin below 2.
  "fastmcp[server]>=3,<4",
  "mcp<2",
  "google-auth>=2.35,<3",
  "httpx>=0.27",
  "requests>=2.31",
  "python-dotenv>=1.0",
]
keywords = ["search-console", "seo", "mcp", "fastmcp", "revenue"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]

[project.scripts]
gsc-opportunity-mcp = "gsc_opportunity.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gsc_opportunity"]

[tool.pytest.ini_options]
testpaths = ["tests"]
